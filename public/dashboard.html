<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herní Radar — Slevy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <span class="navbar__logo">Herní Radar</span>
    <ul class="navbar__links">
      <li><a href="dashboard.html" class="active">Slevy</a></li>
      <li><a href="watchlist.html">Watchlist</a></li>
    </ul>
    <a href="index.html" class="btn btn-outline">Odhlásit</a>
  </nav>

  <div class="container">

    <h1 style="font-size:1.4rem; margin-bottom:0.25rem;">Aktuální slevy</h1>
    <p style="color:#a0a0b0; font-size:0.88rem; margin-bottom:1.5rem;">Steam · Epic · GOG · Humble Bundle</p>

    <form onsubmit="event.preventDefault(); hledatHry();" class="search-container" style="margin-bottom: 25px; display: flex; gap: 10px;">
      <input type="text" id="game-input" placeholder="Zadej název hry..."
             style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white;">
      <button type="submit" class="btn btn-primary" style="padding: 10px 25px;">Hledat</button>
    </form>

    <div class="filter-bar">
      <button class="filter-chip active">Vše</button>
      <button class="filter-chip">Steam</button>
      <button class="filter-chip">Epic</button>
      <button class="filter-chip">GOG</button>
      <button class="filter-chip">Humble</button>
    </div>

    <div class="deals-grid" id="deals-grid">

      <div class="card">
        <div class="card__image">náhled</div>
        <div class="card__body">
          <div style="margin-bottom:6px;">
            <span class="badge badge-steam">Steam</span>
            <span class="badge badge-discount" style="margin-left:4px;">-85%</span>
          </div>
          <div class="card__title">Název hry</div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
            <span>
              <span class="card__price">29 Kč</span>
              <span class="card__price-old">199 Kč</span>
            </span>
            <button class="btn btn-outline" style="padding:3px 8px; font-size:0.75rem;">+ WL</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__image">náhled</div>
        <div class="card__body">
          <div style="margin-bottom:6px;">
            <span class="badge badge-epic">Epic</span>
            <span class="badge badge-free" style="margin-left:4px;">Zdarma</span>
          </div>
          <div class="card__title">Název hry</div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
            <span>
              <span class="card__price">0 Kč</span>
              <span class="card__price-old">599 Kč</span>
            </span>
            <button class="btn btn-outline" style="padding:3px 8px; font-size:0.75rem;">+ WL</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__image">náhled</div>
        <div class="card__body">
          <div style="margin-bottom:6px;">
            <span class="badge badge-gog">GOG</span>
            <span class="badge badge-discount" style="margin-left:4px;">-60%</span>
          </div>
          <div class="card__title">Název hry</div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
            <span>
              <span class="card__price">79 Kč</span>
              <span class="card__price-old">199 Kč</span>
            </span>
            <button class="btn btn-outline" style="padding:3px 8px; font-size:0.75rem;">+ WL</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="footer">© 2025 Herní Radar</div>

  <script src="games.js"></script>

  <script>
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>

</body>
</html>
