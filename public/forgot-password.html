<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Herní Radar — Zapomenuté heslo</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h2>Zapomenuté heslo</h2>
        <p style="color:#a0a0b0; font-size:0.85rem; text-align:center; margin-bottom:1.25rem;">
            Zadej svůj email a pošleme ti odkaz pro reset hesla.
        </p>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="forgot-email" placeholder="email@seznam.cz" />
        </div>

        <button class="btn btn-primary" style="width:100%" onclick="odeslat()">Odeslat odkaz</button>

        <p id="zprava" style="text-align:center; margin-top:1rem; font-size:0.82rem; color:#4caf50; display:none;">
            Pokud email existuje, přijde ti odkaz.
        </p>

        <p style="text-align:center; margin-top:1rem; font-size:0.82rem;">
            <a href="index.html">Zpět na přihlášení</a>
        </p>
    </div>
</div>
<script>
    async function odeslat() {
        const email = document.getElementById('forgot-email').value.trim();
        if (!email) return alert("Zadej email.");

        const btn = document.querySelector('.btn-primary');
        btn.disabled = true;
        btn.textContent = "Odesílám...";

        try {
            const res = await fetch('/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('zprava').style.display = 'block';
            } else {
                alert("Chyba: " + data.error);
            }
        } catch {
            alert("Server neodpovídá.");
        }

        btn.disabled = false;
        btn.textContent = "Odeslat odkaz";
    }
</script>
</body>
</html>
