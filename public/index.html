<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Herní Radar - Login</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #2a2a2a; padding: 20px; border-radius: 8px; width: 300px; }
        input { width: 90%; margin-bottom: 10px; padding: 8px; }
        button { width: 100%; padding: 10px; background: #007bff; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>Herní Radar</h2>
    <input type="text" placeholder="Uživatelské jméno" id="user">
    <input type="password" placeholder="Heslo" id="pass">
    <button onclick="alert('Zatím jen layout - napojení ve 3. týdnu!')">Přihlásit se / Registrovat</button>
</div>
</body>
</html>
