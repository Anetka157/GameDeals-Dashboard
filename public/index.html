<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Herní Radar — Přihlášení</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h2>Herní Radar</h2>

        <div class="form-group">
            <label for="username">Uživatelské jméno</label>
            <input type="text" id="username" placeholder="tvuj_nick" />
        </div>

        <div class="form-group">
            <label for="password">Heslo</label>
            <input type="password" id="password" placeholder="••••••••" />
        </div>

        <button class="btn btn-primary" style="width:100%" onclick="prihlaseni()">Přihlásit se</button>

        <p style="text-align:center; margin-top:0.75rem; font-size:0.82rem;">
            <a href="forgot-password.html">Zapomenuté heslo?</a>
        </p>

        <p style="text-align:center; margin-top:0.5rem; font-size:0.82rem; color:#a0a0b0;">
            Nemáš účet? <a href="register.html">Registrovat se</a>
        </p>
    </div>
</div>
<script src="auth.js"></script>
</body>
</html>
