<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Herní Radar — Nové heslo</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h2>Nové heslo</h2>

        <div class="form-group">
            <label>Nové heslo</label>
            <input type="password" id="new-pass" placeholder="••••••••" />
        </div>

        <div class="form-group">
            <label>Heslo znovu</label>
            <input type="password" id="new-pass2" placeholder="••••••••" />
            <span id="pass-error" style="font-size:0.78rem; color:#e57373; display:none; margin-top:4px;">
        Hesla se neshodují.
      </span>
        </div>

        <button class="btn btn-primary" style="width:100%" onclick="resetovat()">Uložit heslo</button>

        <p id="uspech" style="text-align:center; margin-top:1rem; font-size:0.82rem; color:#4caf50; display:none;">
            Heslo změněno! <a href="index.html">Přihlásit se</a>
        </p>
    </div>
</div>
<script>
    async function resetovat() {
        const p1 = document.getElementById('new-pass').value;
        const p2 = document.getElementById('new-pass2').value;
        const err = document.getElementById('pass-error');

        if (p1 !== p2) {
            err.style.display = 'block';
            return;
        }
        err.style.display = 'none';

        if (p1.length < 6) return alert("Heslo musí mít alespoň 6 znaků.");

        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) return alert("Neplatný odkaz.");

        try {
            const res = await fetch('/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password: p1 })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('uspech').style.display = 'block';
                document.querySelector('.btn-primary').style.display = 'none';
            } else {
                alert("Chyba: " + data.error);
            }
        } catch {
            alert("Server neodpovídá.");
        }
    }
</script>
</body>
</html>
