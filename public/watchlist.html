<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herní Radar — Watchlist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="navbar">
  <span class="navbar__logo">Herní Radar</span>
  <ul class="navbar__links">
    <li><a href="dashboard.html">Slevy</a></li>
    <li><a href="watchlist.html" class="active">Watchlist</a></li>
  </ul>
  <div style="display:flex; align-items:center; gap:0.75rem;">
    <span id="nav-user" style="font-size:0.82rem; color:#a0a0b0;"></span>
    <a href="index.html" class="btn btn-outline" onclick="odhlasit()">Odhlásit</a>
  </div>
</nav>

<div class="container">
  <div class="section-header">
    <h2>Watchlist</h2>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
      <tr>
        <th>Hra</th>
        <th>Platforma</th>
        <th>Cena při přidání</th>
        <th>Aktuální cena</th>
        <th>Přidáno</th>
        <th></th>
      </tr>
      </thead>
      <tbody id="watchlist-grid">
      <tr>
        <td colspan="6" style="color:#a0a0b0; text-align:center; padding:1.5rem;">Načítání...</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal (stejný jako na dashboardu) -->
<div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; padding:1rem;">
  <div style="background:#1a1d27; border:1px solid #2a2d3a; border-radius:12px; max-width:600px; width:100%; padding:1.5rem; position:relative; max-height:90vh; overflow-y:auto;">
    <button onclick="zavritModal()" style="position:absolute; top:12px; right:14px; background:none; border:none; color:#a0a0b0; font-size:1.2rem; cursor:pointer;">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<div class="footer">© 2025 Herní Radar</div>

<script src="watchlist.js"></script>
<script>
  const userName = localStorage.getItem('userName');
  if (userName) document.getElementById('nav-user').textContent = userName;
  function odhlasit() {
    localStorage.removeItem('userId');
    localStorage.removeItem('userName');
  }
  window.addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal')) zavritModal();
  });
</script>

</body>
</html>
